# name: Balanced (fullscreen)
# description: 1280x800 fullscreen, OpenGL, Openxcom shader, VSync — повседневный профиль
displayWidth: 1280
displayHeight: 800
fullscreen: true
borderless: false
allowResize: false
useOpenGL: true
useOpenGLShader: Shaders/Openxcom.OpenGL.shader
useOpenGLSmoothing: false
vSyncForOpenGL: true
keepAspectRatio: true
geoscapeScale: 0
battlescapeScale: 0
useScaleFilter: false
useHQXFilter: false
useXBRZFilter: false
nonSquarePixelRatio: false
