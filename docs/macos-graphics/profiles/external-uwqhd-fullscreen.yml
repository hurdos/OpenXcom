# name: External UWQHD (fullscreen)
# description: 3440x1440 fullscreen, OpenGL, SABR-XCOMified — заполняет внешний 3440x1440
displayWidth: 3440
displayHeight: 1440
fullscreen: true
borderless: false
allowResize: false
useOpenGL: true
useOpenGLShader: Shaders/SABR-XCOMified.OpenGL.shader
useOpenGLSmoothing: false
vSyncForOpenGL: true
keepAspectRatio: true
geoscapeScale: 0
battlescapeScale: 0
useScaleFilter: false
useHQXFilter: false
useXBRZFilter: false
nonSquarePixelRatio: false
