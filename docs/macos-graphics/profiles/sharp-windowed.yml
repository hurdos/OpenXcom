# name: Sharp (windowed)
# description: 1280x800 windowed, OpenGL, Openxcom shader — максимальная резкость 1:1 на Retina
displayWidth: 1280
displayHeight: 800
fullscreen: false
borderless: false
allowResize: false
useOpenGL: true
useOpenGLShader: Shaders/Openxcom.OpenGL.shader
useOpenGLSmoothing: false
vSyncForOpenGL: true
keepAspectRatio: true
geoscapeScale: 0
battlescapeScale: 0
useScaleFilter: false
useHQXFilter: false
useXBRZFilter: false
nonSquarePixelRatio: false
