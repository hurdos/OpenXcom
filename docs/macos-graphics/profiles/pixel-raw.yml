# name: Pixel-perfect (windowed, Raw)
# description: 1280x800 windowed, OpenGL, Raw shader — чистые пиксели без сглаживания
displayWidth: 1280
displayHeight: 800
fullscreen: false
borderless: false
allowResize: false
useOpenGL: true
useOpenGLShader: Shaders/Raw.OpenGL.shader
useOpenGLSmoothing: false
vSyncForOpenGL: true
keepAspectRatio: true
geoscapeScale: 0
battlescapeScale: 0
useScaleFilter: false
useHQXFilter: false
useXBRZFilter: false
nonSquarePixelRatio: false
